<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zipper Production Calculator</title>
    <!-- Import Tailwind CSS for instant, beautiful styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-lg border border-gray-100">
        <h2 class="text-2xl font-extrabold text-gray-900 mb-2">Zipper Calculator</h2>
        <p class="text-gray-500 mb-6 text-sm">Calculate required meters and rolls for production.</p>

        <!-- Input Form -->
        <div class="space-y-5">
            <div class="grid grid-cols-2 gap-4">
                <!-- Zipper Type -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Zipper Type</label>
                    <select id="zipType" onchange="calculate()" class="w-full border border-gray-300 rounded-lg px-4 py-2 bg-gray-50 focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="Vislon">Vislon (90m Roll)</option>
                        <option value="CFC">CFC (180m Roll)</option>
                    </select>
                </div>
                <!-- Measurement Unit -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Unit</label>
                    <select id="unit" onchange="calculate()" class="w-full border border-gray-300 rounded-lg px-4 py-2 bg-gray-50 focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="cm">Centimeters (cm)</option>
                        <option value="inches">Inches (in)</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <!-- Requested Size -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Size per Zip</label>
                    <input type="number" id="size" placeholder="e.g. 45" oninput="calculate()" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <!-- Quantity -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Quantity (pcs)</label>
                    <input type="number" id="qty" placeholder="e.g. 20" oninput="calculate()" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
            </div>
        </div>

        <!-- Results Section -->
        <div class="mt-8 p-6 bg-blue-50 border border-blue-200 rounded-xl">
            <h3 class="text-blue-800 text-xs font-bold uppercase tracking-wider mb-4">Production Requirements</h3>
            
            <div class="grid grid-cols-2 gap-4 mb-4">
                <div>
                    <p class="text-gray-500 text-sm font-medium mb-1">Total Length</p>
                    <p id="metersResult" class="text-3xl font-black text-blue-700">0.00 <span class="text-lg">m</span></p>
                </div>
                <div>
                    <p class="text-gray-500 text-sm font-medium mb-1">Total Rolls</p>
                    <p id="rollsResult" class="text-3xl font-black text-blue-700">0.00</p>
                </div>
            </div>

            <!-- Mathematical Breakdown -->
            <div class="pt-4 border-t border-blue-200">
                <p id="breakdown" class="text-xs text-blue-600 font-medium leading-relaxed">
                    Enter your measurements above to see the calculation breakdown.
                </p>
            </div>
        </div>
    </div>

    <!-- The Mathematical Brain (JavaScript) -->
    <script>
        function calculate() {
            // 1. Get the values from the inputs
            const type = document.getElementById('zipType').value;
            const unit = document.getElementById('unit').value;
            const size = parseFloat(document.getElementById('size').value);
            const qty = parseInt(document.getElementById('qty').value);

            // If the user hasn't typed anything yet, stop here
            if (isNaN(size) || isNaN(qty) || size <= 0 || qty <= 0) {
                document.getElementById('metersResult').innerHTML = '0.00 <span class="text-lg">m</span>';
                document.getElementById('rollsResult').innerText = '0.00';
                document.getElementById('breakdown').innerText = 'Enter your measurements above to see the calculation breakdown.';
                return;
            }

            // 2. Determine the Allowance
            let allowance = 0;
            if (unit === 'cm') {
                allowance = 5; // 5cm for both Vislon and CFC
            } else if (unit === 'inches') {
                allowance = 1.5; // Updated: Now 1.5 inches for BOTH Vislon and CFC
            }

            // 3. Calculate Effective Size
            const effectiveSize = size + allowance;
            
            // 4. Calculate Total Meters
            let totalMeters = 0;
            if (unit === 'cm') {
                // (Effective cm * quantity) / 100 = meters
                totalMeters = (effectiveSize * qty) / 100;
            } else if (unit === 'inches') {
                // (Effective inches * quantity) * 0.0254 = meters
                totalMeters = (effectiveSize * qty) * 0.0254;
            }

            // 5. Calculate Rolls required
            const rollSize = (type === 'Vislon') ? 90 : 180;
            const rolls = totalMeters / rollSize;

            // 6. Push the results to the screen
            document.getElementById('metersResult').innerHTML = totalMeters.toFixed(2) + ' <span class="text-lg">m</span>';
            document.getElementById('rollsResult').innerText = rolls.toFixed(2);
            
            // Generate the helpful breakdown text
            let unitLabel = unit === 'cm' ? 'cm' : 'in';
            document.getElementById('breakdown').innerText = 
                `Calculation: (${size}${unitLabel} + ${allowance}${unitLabel} allowance) × ${qty} pcs = ${totalMeters.toFixed(2)} meters.`;
        }
    </script>
    <button onclick="toggleCalculator()" class="fixed bottom-6 right-6 bg-gray-900 text-white p-4 rounded-full shadow-2xl hover:bg-gray-800 transition transform hover:scale-110 z-50 text-2xl border-4 border-white">
        🧮
    </button>

    <div id="calcModal" class="hidden fixed bottom-24 right-6 bg-white p-5 rounded-2xl shadow-2xl border border-gray-200 w-64 z-50">
        <div class="flex justify-between items-center mb-3">
            <h3 class="text-sm font-bold text-gray-700 uppercase tracking-wider">Quick Calc</h3>
            <button onclick="toggleCalculator()" class="text-gray-400 hover:text-red-500 font-bold text-xl">&times;</button>
        </div>
        
        <input type="text" id="calcDisplay" class="w-full bg-gray-50 border border-gray-200 rounded-lg p-3 text-right text-2xl font-mono mb-4 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-gray-800 shadow-inner" placeholder="0" readonly>
        
        <div class="grid grid-cols-4 gap-2">
            <button onclick="calcInput('7')" class="bg-gray-100 hover:bg-gray-200 p-3 rounded-lg font-bold text-gray-700 transition">7</button>
            <button onclick="calcInput('8')" class="bg-gray-100 hover:bg-gray-200 p-3 rounded-lg font-bold text-gray-700 transition">8</button>
            <button onclick="calcInput('9')" class="bg-gray-100 hover:bg-gray-200 p-3 rounded-lg font-bold text-gray-700 transition">9</button>
            <button onclick="calcInput('/')" class="bg-blue-50 text-blue-600 hover:bg-blue-100 p-3 rounded-lg font-bold transition">&divide;</button>

            <button onclick="calcInput('4')" class="bg-gray-100 hover:bg-gray-200 p-3 rounded-lg font-bold text-gray-700 transition">4</button>
            <button onclick="calcInput('5')" class="bg-gray-100 hover:bg-gray-200 p-3 rounded-lg font-bold text-gray-700 transition">5</button>
            <button onclick="calcInput('6')" class="bg-gray-100 hover:bg-gray-200 p-3 rounded-lg font-bold text-gray-700 transition">6</button>
            <button onclick="calcInput('*')" class="bg-blue-50 text-blue-600 hover:bg-blue-100 p-3 rounded-lg font-bold transition">&times;</button>

            <button onclick="calcInput('1')" class="bg-gray-100 hover:bg-gray-200 p-3 rounded-lg font-bold text-gray-700 transition">1</button>
            <button onclick="calcInput('2')" class="bg-gray-100 hover:bg-gray-200 p-3 rounded-lg font-bold text-gray-700 transition">2</button>
            <button onclick="calcInput('3')" class="bg-gray-100 hover:bg-gray-200 p-3 rounded-lg font-bold text-gray-700 transition">3</button>
            <button onclick="calcInput('-')" class="bg-blue-50 text-blue-600 hover:bg-blue-100 p-3 rounded-lg font-bold transition">&minus;</button>

            <button onclick="calcClear()" class="bg-red-50 text-red-600 hover:bg-red-100 p-3 rounded-lg font-bold transition">C</button>
            <button onclick="calcInput('0')" class="bg-gray-100 hover:bg-gray-200 p-3 rounded-lg font-bold text-gray-700 transition">0</button>
            <button onclick="calcInput('.')" class="bg-gray-100 hover:bg-gray-200 p-3 rounded-lg font-bold text-gray-700 transition">.</button>
            <button onclick="calcInput('+')" class="bg-blue-50 text-blue-600 hover:bg-blue-100 p-3 rounded-lg font-bold transition">&plus;</button>

            <button onclick="calcCalculate()" class="col-span-4 bg-blue-600 text-white hover:bg-blue-700 p-3 rounded-lg font-bold mt-2 shadow-md transition">=</button>
        </div>
    </div>

    <script>
        let isCalcOpen = false;
        const calcDisplay = document.getElementById('calcDisplay');

        function toggleCalculator() {
            const modal = document.getElementById('calcModal');
            isCalcOpen = !isCalcOpen;
            modal.classList.toggle('hidden');
        }

        function calcInput(val) {
            // Prevent multiple decimals in one number
            if (val === '.' && calcDisplay.value.includes('.') && !calcDisplay.value.match(/[+\-*/]/)) return; 
            calcDisplay.value += val;
        }

        function calcClear() {
            calcDisplay.value = '';
        }

        function calcCalculate() {
            try {
                if (calcDisplay.value === '') return;
                // Secure calculation string evaluation
                let result = new Function('return ' + calcDisplay.value)();
                
                // Limit to 4 decimal places so it fits on screen nicely
                if (!Number.isInteger(result)) {
                    result = parseFloat(result.toFixed(4));
                }
                
                calcDisplay.value = result;
            } catch (error) {
                calcDisplay.value = 'Error';
                setTimeout(calcClear, 1200); // Auto clear error after a second
            }
        }

        // Listen for Keyboard typing ANYWHERE on the screen (if calculator is open)
        document.addEventListener('keydown', function(event) {
            if (!isCalcOpen) return; // Ignore keyboard if calc is closed

            const validKeys = '0123456789+-*/.';
            
            if (validKeys.includes(event.key)) {
                event.preventDefault(); // Stop page from scrolling if hitting space/etc
                calcInput(event.key);
            } else if (event.key === 'Enter' || event.key === '=') {
                event.preventDefault();
                calcCalculate();
            } else if (event.key === 'Backspace') {
                event.preventDefault();
                calcDisplay.value = calcDisplay.value.slice(0, -1);
            } else if (event.key === 'Escape' || event.key === 'c' || event.key === 'C') {
                calcClear();
            }
        });
    </script>

</body>
</html>
